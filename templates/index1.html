<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>股票数据查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>A股日线数据查询（新浪数据源）</h2>
    <div class="row mt-3">
        <div class="col-auto">
            <input type="text" id="stockCode" class="form-control" placeholder="输入股票代码：600584/000001">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" onclick="getData()">查询数据</button>
            <a class="btn btn-success d-none" id="downBtn" href="">导出CSV</a>
        </div>
    </div>
    <div class="mt-4" id="tableBox"></div>

    <script>
        async function getData(){
            let code = document.getElementById('stockCode').value.trim();
            if(!code){
                alert("请输入股票代码");
                return;
            }
            let res = await fetch(`/api/data?code=${code}`).then(r=>r.json());
            if(res.status!=='ok'){
                alert(res.message);
                return;
            }
            document.getElementById('tableBox').innerHTML = res.preview_html;
            let down = document.getElementById('downBtn');
            down.classList.remove('d-none');
            down.href = `/export?code=${code}`;
        }
    </script>
</body>
</html>
