<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>股票数据查询</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>股票历史数据查询（仅预览）</h2>
    <input type="text" id="code" placeholder="输入股票代码，如600584">
    <button onclick="queryData()">查询</button>
    <button onclick="exportCSV()">导出CSV</button>
    <div id="result" style="margin-top:20px;"></div>

    <script>
        async function queryData() {
            const code = document.getElementById('code').value.trim();
            if (!code) {
                alert('请输入代码');
                return;
            }
            const res = await fetch(`/api/data?code=${code}`);
            const data = await res.json();
            if (data.status === 'ok') {
                document.getElementById('result').innerHTML = data.preview_html;
            } else {
                document.getElementById('result').innerHTML = `<p class="error">错误：${data.message}</p>`;
            }
        }

        function exportCSV() {
            const code = document.getElementById('code').value.trim();
            if (code) {
                window.location.href = `/export?code=${code}`;
            } else {
                alert('请先查询');
            }
        }
    </script>
</body>
</html>
