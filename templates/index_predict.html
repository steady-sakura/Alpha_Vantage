<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>股票K线图 - 线性回归预测 + K-Means</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="container mt-4">
    <h2>股票K线图（线性回归预测 + K-Means市场状态）</h2>
    <div class="row mt-3 align-items-end">
        <div class="col-auto">
            <label class="form-label">股票代码</label>
            <input type="text" id="stockCode" class="form-control" placeholder="例如 600584">
        </div>
        <div class="col-auto">
            <label class="form-label">预测天数 (1~20)</label>
            <input type="number" id="predDays" class="form-control" value="5" min="1" max="20">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" onclick="loadData()">查询 & 预测</button>
            <a class="btn btn-success d-none" id="downBtn" href="">导出CSV</a>
        </div>
    </div>
    <div class="mt-4" id="tableBox"></div>
    <div id="chartContainer" class="mt-4" style="min-height: 600px;"></div>

    <script>
        async function loadData() {
            const code = document.getElementById('stockCode').value.trim();
            const predDays = document.getElementById('predDays').value;
            if (!code) return alert('请输入代码');

            const chartDiv = document.getElementById('chartContainer');
            chartDiv.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div><p>加载中... (首次请求可能需要5-10秒，请耐心等待)</p></div>';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000); // 20秒超时

            try {
                // 1. 获取表格数据
                let dataRes = await fetch(`/api/data?code=${code}`, { signal: controller.signal }).then(r => r.json());
                if (dataRes.status !== 'ok') {
                    alert(dataRes.message);
                    chartDiv.innerHTML = `<div class="alert alert-danger">数据获取失败: ${dataRes.message}</div>`;
                    clearTimeout(timeoutId);
                    return;
                }
                document.getElementById('tableBox').innerHTML = dataRes.preview_html;
                document.getElementById('downBtn').classList.remove('d-none');
                document.getElementById('downBtn').href = `/export?code=${code}`;

                // 2. 获取图表JSON（包含预测）
                let chartRes = await fetch(`/api/charts?code=${code}&pred_days=${predDays}`, { signal: controller.signal }).then(r => r.json());
                clearTimeout(timeoutId);
                if (chartRes.status !== 'ok') {
                    chartDiv.innerHTML = `<div class="alert alert-danger">图表生成失败: ${chartRes.message}</div>`;
                    return;
                }
                const figData = JSON.parse(chartRes.fig_json);
                chartDiv.innerHTML = '';
                Plotly.newPlot(chartDiv, figData.data, figData.layout, { responsive: true });
                console.log("图表渲染完成，包含预测曲线");
            } catch (err) {
                clearTimeout(timeoutId);
                console.error(err);
                let errMsg = err.name === 'AbortError' ? '请求超时（20秒），新浪数据源较慢，请重试。' : err.message;
                chartDiv.innerHTML = `<div class="alert alert-danger">错误: ${errMsg}</div>`;
            }
        }
    </script>
</body>
</html>
